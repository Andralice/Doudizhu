<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>斗地主</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- Toast -->
  <div class="toast"></div>

  <!-- ===== Login Screen ===== -->
  <div id="screen-login" class="screen-login" style="display:flex">
    <div class="login-card">
      <div class="login-logo">🃏</div>
      <h1>斗地主</h1>
      <p class="login-subtitle">输入账号和昵称开始游戏</p>
      <div class="form-group">
        <label>账号</label>
        <input id="input-login-account" placeholder="输入账号（如手机号或英文名）" maxlength="20" onkeyup="if(event.key==='Enter')window.doLogin()">
      </div>
      <div class="form-group">
        <label>昵称</label>
        <input id="input-login-name" placeholder="游戏内显示名称" maxlength="8" onkeyup="if(event.key==='Enter')window.doLogin()">
      </div>
      <button class="btn btn-primary btn-lg" onclick="window.doLogin()">进入游戏</button>
      <p id="login-error" class="error-text"></p>
      <p id="login-auto" class="info-text" style="display:none">自动登录中...</p>
    </div>
  </div>

  <!-- ===== Home Screen ===== -->
  <div id="screen-home" class="screen-home" style="display:none">
    <div class="home-container">
      <div class="home-header">
        <div>
          <h1>🃏 斗地主</h1>
          <p class="user-info"><span id="home-player-name"></span> · <span id="home-account-id"></span></p>
        </div>
        <button class="btn btn-sm btn-outline" onclick="window.logout()">退出</button>
      </div>
      <div class="card-panel">
        <h3>创建房间</h3>
        <button class="btn btn-primary btn-lg" onclick="window.doCreateRoom()">创建新房间</button>
      </div>
      <div class="card-panel">
        <h3>加入房间</h3>
        <div class="join-row">
          <input id="input-join-room" placeholder="输入6位房间号" maxlength="6" inputmode="numeric" onkeyup="if(event.key==='Enter')window.doJoinRoom()">
          <button class="btn btn-secondary" onclick="window.doJoinRoom()">加入</button>
        </div>
      </div>
      <div class="card-panel" id="history-panel">
        <h3>历史战绩</h3>
        <div class="history-list" id="history-list"></div>
      </div>
      <p id="home-error" class="error-text"></p>
    </div>
  </div>

  <!-- ===== Room Screen ===== -->
  <div id="screen-room" class="screen-room" style="display:none">
    <div class="room-container">
      <div class="room-header-bar">
        <button class="btn btn-sm btn-outline" onclick="window.doLeaveRoom()">离开</button>
        <div class="room-id-badge">房间 <strong id="room-id-display"></strong></div>
        <button id="btn-add-ai" class="btn btn-sm btn-ai" onclick="window.doAddAI()">+ AI玩家</button>
      </div>
      <div class="player-grid">
        <div id="room-slot-0" class="player-slot"></div>
        <div id="room-slot-1" class="player-slot"></div>
        <div id="room-slot-2" class="player-slot"></div>
      </div>
      <div class="room-actions">
        <p class="room-status" id="room-status"></p>
        <button id="btn-ready" class="btn btn-lg btn-primary" onclick="window.doToggleReady()">准备</button>
      </div>
      <p id="room-error" class="error-text"></p>
    </div>
  </div>

  <!-- ===== Game Screen ===== -->
  <div id="screen-game" class="screen-game" style="display:none">
    <div class="game-phase-bar" id="phase-bar"></div>
    <div class="bottom-cards-bar" id="bottom-cards-bar" style="display:none"></div>

    <div class="game-layout">
      <!-- Left opponent -->
      <div class="opponent-area left">
        <div class="opp-avatar">?</div>
        <div class="opp-name" id="name-left">等待</div>
        <div class="opp-role" id="role-left" style="display:none"></div>
        <div class="opp-count" id="count-left">0张</div>
        <div class="opp-played" id="tiny-left" style="display:none"></div>
      </div>

      <!-- Center -->
      <div class="center-play-area">
        <div class="played-row" id="played-left-cards"></div>
        <div class="played-row" id="played-right-cards"></div>
        <div class="played-row my-played" id="played-mine-cards"></div>
        <div class="turn-hint" id="turn-indicator"></div>
      </div>

      <!-- Right opponent -->
      <div class="opponent-area right">
        <div class="opp-avatar">?</div>
        <div class="opp-name" id="name-right">等待</div>
        <div class="opp-role" id="role-right" style="display:none"></div>
        <div class="opp-count" id="count-right">0张</div>
        <div class="opp-played" id="tiny-right" style="display:none"></div>
      </div>
    </div>

    <!-- My info bar -->
    <div class="my-info-bar">
      <span id="my-info-name"></span>
      <span id="my-info-role" class="my-role" style="display:none"></span>
      <span id="my-info-count">0张</span>
    </div>

    <!-- Hand -->
    <div class="hand-area" id="hand-area">
      <div class="hand-cards-row" id="hand-cards-row"></div>
    </div>

    <!-- Action buttons -->
    <div class="action-bar">
      <button class="btn btn-play" id="btn-play" onclick="window.doPlay()" disabled>出牌</button>
      <button class="btn btn-pass" id="btn-pass" onclick="window.doPass()" disabled>不出</button>
      <button class="btn btn-hint" id="btn-hint" onclick="window.doHint()" disabled>提示</button>
    </div>

    <!-- Bidding overlay -->
    <div class="overlay" id="overlay-bid" style="display:none">
      <div class="overlay-box">
        <p id="bid-message"></p>
        <div class="bid-btns">
          <button class="btn btn-secondary bid-btn" data-score="0" onclick="window.doBid(0)">不叫</button>
          <button class="btn btn-primary bid-btn" data-score="1" onclick="window.doBid(1)">1分</button>
          <button class="btn btn-primary bid-btn" data-score="2" onclick="window.doBid(2)">2分</button>
          <button class="btn btn-danger bid-btn" data-score="3" onclick="window.doBid(3)">3分</button>
        </div>
      </div>
    </div>

    <!-- Doubling overlay -->
    <div class="overlay" id="overlay-double" style="display:none">
      <div class="overlay-box">
        <p>选择加倍</p>
        <div class="bid-btns">
          <button class="btn btn-secondary" onclick="window.doDouble(0)">不加倍</button>
          <button class="btn btn-primary" onclick="window.doDouble(1)">加倍</button>
          <button class="btn btn-danger" onclick="window.doDouble(2)">超级加倍</button>
        </div>
      </div>
    </div>

    <!-- Result overlay -->
    <div class="overlay" id="overlay-result" style="display:none">
      <div class="overlay-box">
        <h2 id="result-title"></h2>
        <p id="result-details"></p>
        <button class="btn btn-primary btn-lg" onclick="window.doContinue()">继续</button>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
