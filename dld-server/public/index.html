<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>斗地主</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="toast" id="toast"></div>

  <!-- ===== Auth Screen ===== -->
  <div id="scr-auth" class="full flex-center" style="display:flex">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">登录</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">注册</button>
      </div>
      <!-- Login form -->
      <div id="form-login">
        <div class="field"><label>账号</label><input id="login-acc" placeholder="输入账号" maxlength="20" onkeyup="if(event.key==='Enter')doLogin()"></div>
        <button class="btn primary full" id="login-btn" onclick="doLogin()">登录</button>
        <p id="login-err" class="err"></p>
      </div>
      <!-- Register form -->
      <div id="form-register" style="display:none">
        <div class="field"><label>账号</label><input id="reg-acc" placeholder="设置登录账号" maxlength="20"></div>
        <div class="field"><label>昵称</label><input id="reg-name" placeholder="游戏内显示的名称" maxlength="8" onkeyup="if(event.key==='Enter')doRegister()"></div>
        <button class="btn primary full" id="reg-btn" onclick="doRegister()">注册并进入</button>
        <p id="reg-err" class="err"></p>
      </div>
      <p id="auth-auto" class="hint" style="display:none">自动登录中...</p>
    </div>
  </div>

  <!-- ===== Home ===== -->
  <div id="scr-home" class="full" style="display:none">
    <div class="home-wrap">
      <div class="top-bar">
        <div><b class="title-sm">🃏 斗地主</b><p id="home-user" class="dim sm"></p></div>
        <button class="btn ghost sm" onclick="logout()">退出</button>
      </div>
      <div class="card-panel"><button class="btn primary full big" onclick="doCreateRoom()">创建新房间</button></div>
      <div class="card-panel"><h3>加入房间</h3><div class="row"><input id="join-inp" placeholder="6位房间号" maxlength="6" inputmode="numeric" onkeyup="if(event.key==='Enter')doJoinRoom()"><button class="btn secondary" onclick="doJoinRoom()">加入</button></div></div>
      <div class="card-panel" id="stats-panel"><h3>我的战绩</h3><div id="stats-info" class="stats-row"></div></div>
      <div class="card-panel" id="hist-panel" style="display:none"><h3>最近对局</h3><div id="hist-list" class="hlist"></div></div>
      <p id="home-err" class="err"></p>
    </div>
  </div>

  <!-- ===== Room ===== -->
  <div id="scr-room" class="full" style="display:none">
    <div class="room-wrap">
      <div class="top-bar">
        <button class="btn ghost sm" onclick="doLeaveRoom()">← 离开</button>
        <div class="room-tag">房间 <b id="room-id"></b></div>
        <button id="add-ai-btn" class="btn ai sm" onclick="doAddAI()">+AI</button>
      </div>
      <div class="seat-list"><div id="seat-0" class="seat"></div><div id="seat-1" class="seat"></div><div id="seat-2" class="seat"></div></div>
      <div class="room-foot"><p id="room-status" class="dim center"></p><button id="ready-btn" class="btn primary full big" onclick="doToggleReady()">准备</button></div>
      <p id="room-err" class="err center"></p>
    </div>
  </div>

  <!-- ===== Game ===== -->
  <div id="scr-game" class="game-scr" style="display:none">
    <div class="game-inner">
      <div id="game-phase" class="phase-bar"></div>
      <div id="bottom-bar" class="bottom-bar" style="display:none"></div>

      <div class="game-grid">
        <div class="ply ply-left" id="ply-left">
          <div class="ply-av" id="av-left">?</div>
          <div class="ply-nm" id="nm-left"></div>
          <div class="ply-rl" id="rl-left"></div>
          <div class="ply-ct" id="ct-left">0张</div>
          <div class="ply-ty" id="ty-left"></div>
        </div>

        <div class="play-zone">
          <div class="pz-row" id="pz-left"></div>
          <div class="pz-row" id="pz-right"></div>
          <div class="pz-row mine" id="pz-mine"></div>
          <div id="turn-hint" class="turn-hint"></div>
        </div>

        <div class="ply ply-right" id="ply-right">
          <div class="ply-av" id="av-right">?</div>
          <div class="ply-nm" id="nm-right"></div>
          <div class="ply-rl" id="rl-right"></div>
          <div class="ply-ct" id="ct-right">0张</div>
          <div class="ply-ty" id="ty-right"></div>
        </div>
      </div>

      <div class="my-bar"><span id="my-name"></span><span id="my-role"></span><span id="my-count">0张</span></div>
      <div class="hand-wrap" id="hand-wrap"><div class="hand-row" id="hand-row"></div></div>
      <div class="act-bar">
        <button class="btn play-btn" id="btn-play" onclick="doPlay()">出牌</button>
        <button class="btn pass-btn" id="btn-pass" onclick="doPass()">不出</button>
        <button class="btn hint-btn" id="btn-hint" onclick="doHint()">提示</button>
      </div>

      <div class="overlay" id="ov-bid" style="display:none"><div class="ov-box">
        <p id="bid-msg"></p>
        <div class="ov-btns"><button class="btn secondary" onclick="doBid(0)">不叫</button><button class="btn primary" onclick="doBid(1)">1分</button><button class="btn primary" onclick="doBid(2)">2分</button><button class="btn danger" onclick="doBid(3)">3分</button></div>
      </div></div>
      <div class="overlay" id="ov-double" style="display:none"><div class="ov-box">
        <p>选择加倍</p>
        <div class="ov-btns"><button class="btn secondary" onclick="doDouble(0)">不加倍</button><button class="btn primary" onclick="doDouble(1)">加倍</button><button class="btn danger" onclick="doDouble(2)">超级加倍</button></div>
      </div></div>
      <div class="overlay" id="ov-result" style="display:none"><div class="ov-box">
        <h2 id="res-title"></h2><p id="res-detail"></p>
        <button class="btn primary big" onclick="doContinue()">继续</button>
      </div></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
